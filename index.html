<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'">
<title>웹앱 허브</title>
<style>
  :root{--paper:#fbf7ef;--ink:#2d2a26;--soft:#6b645a;--line:#e3d9c7;--card:#fffdf8;--accent:#c8553d;
        --serif:"Nanum Myeongjo","Noto Serif KR","Batang",serif;
        --sans:"Pretendard","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
  @media (prefers-color-scheme:dark){:root{--paper:#1f1d1a;--ink:#efe9de;--soft:#a79f92;--line:#3a3530;--card:#28251f;--accent:#e07a62}}
  *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans)}
  .wrap{max-width:880px;margin:0 auto;padding:64px 20px}
  h1{font-family:var(--serif);font-size:34px;margin:0 0 8px;letter-spacing:-.5px}
  .sub{color:var(--soft);margin:0 0 40px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
  .card{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);
         border-radius:14px;padding:22px;transition:transform .15s,border-color .15s}
  a.card:hover{transform:translateY(-2px);border-color:var(--accent)}
  .icon{font-size:28px} .card h2{font-size:18px;margin:12px 0 6px} .card p{margin:0;color:var(--soft);font-size:14px;line-height:1.6}
  .tag{display:inline-block;margin-top:14px;font-size:12px;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:2px 8px}
  .soon{border-style:dashed;opacity:.6;pointer-events:none}
  footer{margin-top:56px;color:var(--soft);font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <h1>웹앱 허브</h1>
  <p class="sub">직접 만든 웹앱을 한곳에 모아 둔 페이지입니다.</p>
  <div class="grid">
    <a class="card" href="diary/">
      <div class="icon">📔</div>
      <h2>나의 일기장</h2>
      <p>구글 계정으로 로그인해 나만 볼 수 있는 일기를 쓰고, 달력과 검색으로 다시 찾아봅니다.</p>
      <span class="tag">Google 로그인</span>
    </a>
    <div class="card soon" aria-hidden="true">
      <div class="icon">＋</div>
      <h2>다음 웹앱</h2>
      <p>새로 만든 앱을 여기에 추가하세요.</p>
    </div>
  </div>
  <footer>웹앱 허브 · GitHub Pages로 배포</footer>
</div>
</body>
</html>
