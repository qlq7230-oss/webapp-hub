<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://*.googleapis.com https://*.firebaseapp.com https://*.google.com; frame-src https://*.firebaseapp.com https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="robots" content="noindex">
<title>나의 일기장</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 로딩 -->
<div class="loading" id="boot">불러오는 중…</div>

<!-- 로그인 화면 -->
<div class="login" id="loginView" hidden>
  <div class="login-card">
    <h1>나의 일기장</h1>
    <p>구글 계정으로 로그인하면<br>나만 볼 수 있는 일기장이 열립니다.</p>
    <button class="g-btn" id="loginBtn">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.5l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.8 6C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.8-6C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.8-6z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.2-13.5-9.9l-7.8 6C6.6 42.6 14.6 48 24 48z"/></svg>
      Google 계정으로 로그인
    </button>
    <label class="keep"><input type="checkbox" id="keepLogin"> 이 기기에서 로그인 유지</label>
    <div class="login-note">학교·공용 컴퓨터에서는 체크하지 마세요.<br>체크하지 않으면 브라우저를 닫을 때 자동으로 로그아웃됩니다.</div>
    <a class="back" href="../">← 웹앱 허브로</a>
  </div>
</div>

<!-- 일기장 -->
<div id="appView" hidden>
<button class="menu-btn" id="menuBtn">☰ 목록</button>
<div class="app">
  <aside id="side">
    <div class="brand"><h1>나의 일기장</h1><small id="count"></small></div>
    <div class="userbar"><span id="userName"></span><button id="logoutBtn">로그아웃</button></div>
    <button class="new-btn" id="newBtn">✎ 오늘 일기 쓰기</button>

    <div class="cal">
      <div class="cal-head">
        <button id="prevM" aria-label="이전 달">◀</button>
        <b id="calTitle"></b>
        <button id="nextM" aria-label="다음 달">▶</button>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>

    <div class="search"><input id="q" type="search" placeholder="제목·내용 검색"></div>
    <div class="filter-note" id="filterNote" hidden><span id="filterText"></span><button id="clearFilter">전체 보기</button></div>
    <div class="list" id="list"></div>
    <div class="side-foot"><a href="../">← 허브</a><button id="exportBtn">백업 받기</button></div>
  </aside>

  <main><div class="sheet" id="sheet"></div></main>
</div>
</div>
<div class="toast" id="toast"></div>

<script type="module" src="app.js"></script>
</body>
</html>
